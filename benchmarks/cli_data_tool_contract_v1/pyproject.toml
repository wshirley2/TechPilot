[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-data-tool"
version = "0.1.0"
description = "A tiny CLI used as a TechPilot benchmark repository."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
data-tool = "cli_data_tool.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
